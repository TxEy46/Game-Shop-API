version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: game-shop-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: game_store
      MYSQL_USER: game_shop
      MYSQL_PASSWORD: 1
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: game-shop-app
    restart: always
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      - db

volumes:
  db_data:
